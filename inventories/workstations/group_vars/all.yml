#    filename: on3iropolos-ssh
#    private_key: "{{ lookup('env', 'GITHUB_SSH_PRIVATE_KEY') | default('') }}"
#    public_key: "{{ lookup('env', 'GITHUB_SSH_PUBLIC_KEY') | default('') }}"
#    host: github.com

