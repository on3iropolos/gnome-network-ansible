---
# Global Config
install_root: /mnt
# install_drive: /dev/nvme0n1 # Passed via CLI -e "install_drive=/dev/..."
boot_mode: uefi

# Encryption
encryption_enabled: false
encryption_password: "{{ lookup('env', 'ENCRYPTION_PASSWORD') | default('') }}"
encryption_format: luks1

# Filesystem
filesystem_type: btrfs

# Initramfs
initramfs_encryption: "{{ encryption_enabled }}"
initramfs_btrfs: true

# User
user_name: on3ir
user_password: "{{ lookup('env', 'USER_PASSWORD') | default('') }}"
user_ssh_key: "{{ lookup('env', 'USER_SSH_KEY') | default('') }}"

# System
timezone: America/Chicago
locale: en_US.UTF-8

# Git Config
git_user_name: "{{ lookup('env', 'GIT_USER_NAME') | default('on3ir') }}"
git_user_email: "{{ lookup('env', 'GIT_USER_EMAIL') | default('on3iropolos@gmail.com') }}"

# SSH Identities (for cloning repos)
user_ssh_identities: []
