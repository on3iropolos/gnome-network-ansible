---
- name: Provision Image
  hosts: all
  become: true
  vars:
    verify_enabled: false

  roles:
    - role: docker
    - role: kubernetes
      vars:
        verify_enabled: false
    - role: time
    - role: locale
    - role: hosts
    - role: network
    - role: sshd
    - role: user
    - role: ssh_client
    - role: git
    - role: github_cli
    - role: dev-workspace
    - role: bitwarden
    - role: obsidian

    # AUR-based roles
    - role: aur
    - role: spotify
    - role: vscodium
    - role: brave

    # whimsyforge only
    - role: qemu
      when: inventory_hostname == 'whimsyforge.gnome.network'
    - role: gnome
      when: inventory_hostname == 'whimsyforge.gnome.network'

    # - role: antigravity  # Disabled - to be added later
