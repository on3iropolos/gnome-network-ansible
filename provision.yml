---
- name: Provision Image
  hosts: all
  become: true
  vars:
    verify_enabled: false

  roles:
    - role: docker
    - role: time
    - role: locale
    - role: hosts
    - role: network
    - role: sshd
    - role: user
    - role: ssh_client
    - role: git
    - role: bitwarden
    - role: aur
      when: inventory_hostname == 'whimsyforge.gnome.network'
    - role: spotify
      when: inventory_hostname == 'whimsyforge.gnome.network'
    - role: qemu
      when: inventory_hostname == 'whimsyforge.gnome.network'
    - role: gnome
      when: inventory_hostname == 'whimsyforge.gnome.network'
    # - role: antigravity  # Disabled - to be added later
