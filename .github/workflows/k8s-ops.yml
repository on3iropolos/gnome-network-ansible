---
name: Kubernetes Operations CI

on:
  push:
    branches:
      - main
      - develop
      - feature/add-kubernetes-k3d-cluster
    paths:
      - 'kubernetes/**'
      - 'docs/kubernetes/**'
      - 'roles/kubernetes/**'
      - '.github/workflows/k8s-ops.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'kubernetes/**'
      - 'docs/kubernetes/**'
      - 'roles/kubernetes/**'
      - '.github/workflows/k8s-ops.yml'

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'

jobs:
  lint-ansible:
    name: Lint Ansible Playbooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Lint k8s.yml playbook
        run: ansible-lint k8s.yml

      - name: Lint kubernetes playbooks
        run: |
          ansible-lint kubernetes/playbooks/deploy-app.yml || true
          ansible-lint kubernetes/playbooks/scale.yml || true

  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Validate nginx deployment manifest
        run: kubectl apply --dry-run=client -f kubernetes/manifests/nginx-deployment.yaml

      - name: Validate nginx service manifest
        run: kubectl apply --dry-run=client -f kubernetes/manifests/nginx-service.yaml

      - name: Validate nginx ingress manifest
        run: kubectl apply --dry-run=client -f kubernetes/manifests/nginx-ingress.yaml

      - name: Validate app configmap manifest
        run: kubectl apply --dry-run=client -f kubernetes/manifests/app-configmap.yaml

  validate-helm:
    name: Validate Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Lint nginx Helm chart
        run: helm lint kubernetes/helm-charts/sample-app

      - name: Template nginx Helm chart
        run: |
          helm template test-release kubernetes/helm-charts/sample-app \
            --namespace default \
            --dry-run

  molecule-kubernetes:
    name: Molecule Test - Kubernetes
    runs-on: ubuntu-latest
    needs: lint-ansible
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Display Molecule version
        run: molecule --version

      - name: Run Kubernetes role tests
        run: |
          cd roles/kubernetes
          molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for broken links in k8s docs
        run: |
          pip install markdown-link-check
          find docs/k8s -name "*.md" -exec echo "Checking: {}" \; -exec markdown-link-check --quiet {} \; || true

      - name: Display k8s documentation structure
        run: |
          echo "Kubernetes documentation structure:"
          find docs/k8s -type f -name "*.md" | sort
