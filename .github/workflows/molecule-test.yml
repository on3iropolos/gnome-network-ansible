---
name: Molecule Testing

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'roles/**'
      - '.github/workflows/molecule-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'roles/**'
      - '.github/workflows/molecule-test.yml'

jobs:
  detect-changed-roles:
    name: Detect Changed Roles
    runs-on: ubuntu-latest
    outputs:
      ansible_ctrl_init: ${{ steps.filter.outputs.ansible_ctrl_init }}
      docker: ${{ steps.filter.outputs.docker }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      network: ${{ steps.filter.outputs.network }}
      bitwarden: ${{ steps.filter.outputs.bitwarden }}
      brave: ${{ steps.filter.outputs.brave }}
      role_template: ${{ steps.filter.outputs.role_template }}
      vscodium: ${{ steps.filter.outputs.vscodium }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changed roles
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ansible_ctrl_init:
              - 'roles/ansible_ctrl_init/**'
            docker:
              - 'roles/docker/**'
            kubernetes:
              - 'roles/kubernetes/**'
            network:
              - 'roles/network/**'
            bitwarden:
              - 'roles/bitwarden/**'
            brave:
              - 'roles/brave/**'
            role_template:
              - 'roles/role_template/**'
            vscodium:
              - 'roles/vscodium/**'

  build-matrix:
    name: Build Test Matrix
    runs-on: ubuntu-latest
    needs: detect-changed-roles
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build matrix
        id: build
        run: |
          # Roles that have molecule tests
          ROLES_WITH_TESTS=("ansible_ctrl_init" "docker" "kubernetes" "network" "bitwarden" "brave" "role_template" "vscodium")
          
          # Get outputs from detect-changed-roles
          CHANGED_ROLES=""
          
          for role in "${ROLES_WITH_TESTS[@]}"; do
            case $role in
              ansible_ctrl_init) changed=${{ needs.detect-changed-roles.outputs.ansible_ctrl_init }} ;;
              docker) changed=${{ needs.detect-changed-roles.outputs.docker }} ;;
              kubernetes) changed=${{ needs.detect-changed-roles.outputs.kubernetes }} ;;
              network) changed=${{ needs.detect-changed-roles.outputs.network }} ;;
              bitwarden) changed=${{ needs.detect-changed-roles.outputs.bitwarden }} ;;
              brave) changed=${{ needs.detect-changed-roles.outputs.brave }} ;;
              role_template) changed=${{ needs.detect-changed-roles.outputs.role_template }} ;;
              vscodium) changed=${{ needs.detect-changed-roles.outputs.vscodium }} ;;
            esac
            
            if [ "$changed" == "true" ]; then
              if [ -z "$CHANGED_ROLES" ]; then
                CHANGED_ROLES="{\"role\": \"$role\"}"
              else
                CHANGED_ROLES="$CHANGED_ROLES, {\"role\": \"$role\"}"
              fi
            fi
          done
          
          if [ -z "$CHANGED_ROLES" ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
          else
            echo "matrix=[$CHANGED_ROLES]" >> $GITHUB_OUTPUT
          fi

  molecule-test:
    name: Molecule Test
    runs-on: ubuntu-latest
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Molecule tests
        run: mise run molecule-test ${{ matrix.role }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: molecule-logs-${{ matrix.role }}
          path: |
            roles/${{ matrix.role }}/molecule/default/.molecule/
            ~/.cache/molecule/
          retention-days: 7
