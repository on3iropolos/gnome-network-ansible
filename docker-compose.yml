services:
  ansible-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GLIBC_ARCH: x86_64 # or aarch64 for ARM64 builds
    volumes:
      - .:/data
      - ${HOME}/.ssh/git_on3iropolos_ed25519.pub:/root/.ssh/user_public_key.pub:ro
      - ~/.gitconfig:/root/.gitconfig:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock:rw
    stdin_open: true
    tty: true
    group_add:
      - "128" # Host libvirt group GID
    environment:
      ANSIBLE_CONFIG: /data/ansible.cfg
      SSH_PASSWORD: "${SSH_PASSWORD}"
      ENCRYPTION_PASSWORD: "${ENCRYPTION_PASSWORD}"
      USER_PASSWORD: "${USER_PASSWORD}"
    working_dir: /data

