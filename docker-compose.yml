services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "8888:8888"  # API
      - "9999:9999"  # Control Plane
    env_file:
      - .env
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=gemini
    volumes:
      - hindsight-data:/home/hindsight/.pg0

volumes:
  hindsight-data:
