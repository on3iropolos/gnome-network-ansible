{{/*
Create a test to verify the chart renders correctly
*/}}
{{- if .Values.test.enabled -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "sample-app.fullname" . }}-test"
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: test
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command:
        - sh
        - -c
        - |
          echo "Testing connection to {{ include "sample-app.fullname" . }}..."
          curl -f http://{{ include "sample-app.fullname" . }}:{{ .Values.service.port }}
  restartPolicy: Never
{{- end }}
