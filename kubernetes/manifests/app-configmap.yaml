---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: nginx
  annotations:
    description: "Application configuration for nginx"
data:
  NGINX_PORT: "80"
  LOG_LEVEL: "info"
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Kubernetes Demo</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            .container {
                text-align: center;
            }
            h1 { font-size: 2.5em; }
            p { font-size: 1.2em; opacity: 0.9; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Hello from Kubernetes!</h1>
            <p>Running on: <span id="hostname"></span></p>
            <p id="pod-info"></p>
        </div>
        <script>
            document.getElementById('hostname').textContent = window.location.hostname;
        </script>
    </body>
    </html>
