---
- name: Deploy Kubernetes Application
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    state: present
    target_namespace: default
    manifest_file: ""

  tasks:
    - name: Validate manifest_file is provided
      ansible.builtin.fail:
        msg: "manifest_file must be provided"
      when: manifest_file | length == 0

    - name: Check if manifest file exists
      ansible.builtin.stat:
        path: "{{ manifest_file }}"
      register: manifest_stat

    - name: Fail if manifest file does not exist
      ansible.builtin.fail:
        msg: "Manifest file not found: {{ manifest_file }}"
      when: not manifest_stat.stat.exists

    - name: Apply manifest
      kubernetes.core.k8s:
        state: "{{ state }}"
        src: "{{ manifest_file }}"
        namespace: "{{ target_namespace }}"
        validate:
          fail_on_error: false
      register: k8s_result

    - name: Display result
      ansible.builtin.debug:
        var: k8s_result

    - name: Wait for resources to be ready
      when: state == "present"
      block:
        - name: Get deployment info
          kubernetes.core.k8s_info:
            kind: Deployment
            namespace: "{{ target_namespace }}"
          register: deployments

        - name: Wait for deployments to be ready
          kubernetes.core.k8s_scale:
            kind: Deployment
            name: "{{ item.metadata.name }}"
            namespace: "{{ target_namespace }}"
            replicas: "{{ item.spec.replicas }}"
            wait: true
            wait_timeout: 300
          loop: "{{ deployments.resources }}"
          when: item.spec.replicas | default(0) | int > 0
