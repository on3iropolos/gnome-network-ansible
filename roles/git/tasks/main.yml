---
- name: Install Git
  ansible.builtin.package:
    name: git
    state: present

- name: Deploy Git Config
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "/home/{{ user_name }}/.gitconfig"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'

- name: Verification
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]
  when: verify_enabled
