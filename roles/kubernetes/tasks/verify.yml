---
- name: Verify k3d is installed
  ansible.builtin.command: k3d version
  register: k3d_verify
  changed_when: false

- name: Verify kubectl is installed
  ansible.builtin.command: kubectl version --client
  register: kubectl_verify
  changed_when: false

- name: Verify helm is installed
  ansible.builtin.command: helm version
  register: helm_verify
  changed_when: false

- name: Get cluster nodes
  ansible.builtin.command: kubectl get nodes
  register: cluster_nodes
  changed_when: false

- name: Display cluster status
  ansible.builtin.debug:
    msg: "Cluster '{{ k3d_cluster_name }}' is running with nodes: {{ cluster_nodes.stdout }}"
