---
- name: Check if cluster already exists
  ansible.builtin.command: k3d cluster list -o json
  register: k3d_cluster_list
  changed_when: false
  failed_when: false
  tags: [kubernetes]

- name: Parse cluster list
  ansible.builtin.set_fact:
    k3d_clusters: "{{ k3d_cluster_list.stdout | from_json | default([], true) }}"
  changed_when: false
  when: k3d_cluster_list.rc == 0
  tags: [kubernetes]

- name: Check if target cluster exists
  ansible.builtin.set_fact:
    cluster_exists: "{{ k3d_cluster_name in (k3d_clusters | map(attribute='name') | list) }}"
  tags: [kubernetes]

- name: Build k3d cluster create command
  ansible.builtin.set_fact:
    k3d_cluster_args:
      - cluster
      - create
      - "{{ k3d_cluster_name }}"
      - "--servers={{ k3d_server_nodes }}"
      - "--agents={{ k3d_worker_nodes }}"
      - "--kubeconfig-update-default=true"
  when: not cluster_exists
  tags: [kubernetes]

- name: Add port mappings
  ansible.builtin.set_fact:
    k3d_cluster_args: "{{ k3d_cluster_args + ['--port', item] }}"
  loop: "{{ k3d_port_mapping }}"
  when: k3d_port_mapping is defined and not cluster_exists
  tags: [kubernetes]

- name: Create k3d cluster
  ansible.builtin.command: k3d {{ k3d_cluster_args | join(' ') }}
  environment:
    K3D_FIX_DNS: "{{ k3d_fix_dns }}"
  when: not cluster_exists
  changed_when: true
  tags: [kubernetes]

- name: Ensure .kube directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.kube"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user | default(ansible_facts.get('user_id', 'root')) }}"
    group: "{{ ansible_user | default(ansible_facts.get('user_id', 'root')) }}"
  when: ansible_facts['user_dir'] is defined
  tags: [kubernetes]

- name: Remove existing kubeconfig if owned by root
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.kube/config"
    state: absent
  when: ansible_facts['user_dir'] is defined
  ignore_errors: true
  tags: [kubernetes]

- name: Get kubeconfig
  ansible.builtin.command: k3d kubeconfig get {{ k3d_cluster_name }}
  register: kubeconfig_output
  changed_when: false
  when: ansible_facts['user_dir'] is defined
  tags: [kubernetes]

- name: Write kubeconfig
  ansible.builtin.copy:
    content: "{{ kubeconfig_output.stdout }}"
    dest: "{{ ansible_facts['user_dir'] }}/.kube/config"
    owner: "{{ ansible_user | default(ansible_facts.get('user_id', 'root')) }}"
    group: "{{ ansible_user | default(ansible_facts.get('user_id', 'root')) }}"
    mode: "0600"
  when: ansible_facts['user_dir'] is defined and kubeconfig_output.stdout is defined
  tags: [kubernetes]

- name: Verify cluster is running
  ansible.builtin.command: kubectl get nodes
  register: kubectl_nodes
  changed_when: false
  retries: 30
  delay: 2
  until: kubectl_nodes.rc == 0
  tags: [kubernetes]

- name: Check if coredns-custom ConfigMap exists
  ansible.builtin.command: kubectl get configmap coredns-custom -n kube-system
  register: coredns_custom_exists
  changed_when: false
  failed_when: false
  tags: [kubernetes]

- name: Fix CoreDNS (remove broken hosts.override with root SOA)
  when: coredns_custom_exists.rc == 0
  tags: [kubernetes]
  block:
    - name: Remove broken keys from coredns-custom ConfigMap
      ansible.builtin.shell:
        cmd: |
          kubectl patch configmap coredns-custom -n kube-system --type=json \
            -p '[{"op":"remove","path":"/data/hosts.override"},{"op":"remove","path":"/data/additional-dns.db"}]' \
            2>/dev/null; echo "exit: $?"
      register: coredns_fix
      changed_when: "'exit: 0' in coredns_fix.stdout"

    - name: Restart CoreDNS if changed
      when: coredns_fix.changed
      ansible.builtin.command: kubectl rollout restart deployment/coredns -n kube-system
