---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: arch-k8s-instance
    image: ghcr.io/archlinux/archlinux:latest
    pre_build_image: false
    dockerfile: Dockerfile.j2
    privileged: true
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN
    environment:
      container: docker
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_whitelist: profile_tasks, timer, yaml
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/../..
    ssh_connection:
      pipelining: false
  inventory:
    host_vars:
      arch-k8s-instance:
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
