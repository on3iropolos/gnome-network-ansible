---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Verify k3d is installed
      ansible.builtin.command: k3d version
      register: k3d_check
      changed_when: false
      failed_when: false

    - name: Assert k3d is installed
      ansible.builtin.assert:
        that:
          - k3d_check.rc == 0
        fail_msg: "k3d is not installed"
        success_msg: "k3d is installed"

    - name: Verify kubectl is installed
      ansible.builtin.command: kubectl version --client
      register: kubectl_check
      changed_when: false
      failed_when: false

    - name: Assert kubectl is installed
      ansible.builtin.assert:
        that:
          - kubectl_check.rc == 0
        fail_msg: "kubectl is not installed"
        success_msg: "kubectl is installed"

    - name: Verify helm is installed
      ansible.builtin.command: helm version
      register: helm_check
      changed_when: false
      failed_when: false

    - name: Assert helm is installed
      ansible.builtin.assert:
        that:
          - helm_check.rc == 0
        fail_msg: "helm is not installed"
        success_msg: "helm is installed"

    - name: Verify Docker service is running
      ansible.builtin.service_facts:

    - name: Assert Docker service is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['docker.service'] is defined
          - ansible_facts.services['docker.service'].state == 'running'
        fail_msg: "Docker service is not running"
        success_msg: "Docker service is running"

    - name: Display verification results
      ansible.builtin.debug:
        msg: "All kubernetes role verifications passed successfully!"
