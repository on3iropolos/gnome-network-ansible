- name: Encrypt drive
  # ref: LUKS1 required for grub: https://wiki.archlinux.org/title/GRUB#Encrypted_/boot
  community.crypto.luks_device:
    device: "{{ root_part }}"
    state: "opened"
    name: cryptroot
    type: "{{ 'luks1' if arch_iso_install_bootloader == 'grub' else 'luks2' }}"
    passphrase: "{{ arch_iso_install_encryption.password }}"
