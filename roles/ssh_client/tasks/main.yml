---
- name: Deploy SSH Private Keys
  ansible.builtin.copy:
    content: "{{ item.private_key }}"
    dest: "/home/{{ user_name }}/.ssh/{{ item.filename }}"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0600'
  loop: "{{ user_ssh_identities }}"
  when: item.private_key | default('') | length > 0
  no_log: true

- name: Deploy SSH Public Keys
  ansible.builtin.copy:
    content: "{{ item.public_key }}"
    dest: "/home/{{ user_name }}/.ssh/{{ item.filename }}.pub"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'
  loop: "{{ user_ssh_identities }}"
  when: item.public_key | default('') | length > 0

- name: Configure SSH Config
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "/home/{{ user_name }}/.ssh/config"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0600'
  when: user_ssh_identities | length > 0

- name: Install GNOME Keyring packages
  ansible.builtin.package:
    name: "{{ ssh_client_gnome_keyring_packages }}"
    state: present
  when: ssh_client_gnome_keyring_enabled

- name: Create GNOME Keyring SSH autostart directory
  ansible.builtin.file:
    path: "/home/{{ user_name }}/.config/autostart"
    state: directory
    mode: '0755'
    owner: "{{ user_name }}"
  when:
    - ssh_client_gnome_keyring_enabled
    - user_name != "root"
  become: true
  become_user: "{{ user_name }}"

- name: Configure GNOME Keyring SSH autostart
  ansible.builtin.copy:
    dest: "/home/{{ user_name }}/.config/autostart/gnome-keyring-ssh.desktop"
    content: |
      [Desktop Entry]
      Type=Application
      Name=GNOME Keyring SSH Agent
      Exec=/usr/bin/gnome-keyring-daemon --start --components=ssh
      OnlyShowIn=GNOME;COSMIC;DANK;
      X-GNOME-Autostart-enabled=true
    owner: "{{ user_name }}"
    mode: '0644'
  when:
    - ssh_client_gnome_keyring_enabled
    - user_name != "root"
  become: true
  become_user: "{{ user_name }}"

- name: Add SSH keys to GNOME Keyring
  ansible.builtin.command:
    cmd: "ssh-add ~/.ssh/{{ item.filename }}"
  register: ssh_add_result
  failed_when: false
  changed_when: "'Identity added' in ssh_add_result.stdout"
  loop: "{{ user_ssh_identities }}"
  when:
    - ssh_client_gnome_keyring_enabled
    - user_ssh_identities | length > 0
    - item.private_key | default('') | length > 0
    - user_name != "root"
  become: true
  become_user: "{{ user_name }}"

- name: Verification
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]
  when: verify_enabled
