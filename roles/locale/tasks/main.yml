---
- name: Locale Gen
  ansible.builtin.shell: |
    echo "{{ locale }} UTF-8" > /etc/locale.gen && locale-gen
  changed_when: true

- name: Locale Conf
  ansible.builtin.lineinfile:
    path: "/etc/locale.conf"
    regexp: '^LANG='
    line: "LANG={{ locale }}"
    create: yes
    state: present
     
- name: Keymap
  ansible.builtin.lineinfile:
    path: "/etc/vconsole.conf"
    regexp: '^KEYMAP='
    line: "KEYMAP={{ keymap }}"
    create: yes
    state: present

- name: Verification
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]
  when: verify_enabled
