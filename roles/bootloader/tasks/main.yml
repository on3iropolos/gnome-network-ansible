---
- name: Validate arch-chroot target
  ansible.builtin.include_tasks: validate_chroot.yml

- name: Configure Cryptodisk
  when: encryption_enabled | default(true)
  block:
    - name: Enable Cryptodisk
      ansible.builtin.lineinfile:
        dest: /mnt/etc/default/grub
        line: "GRUB_ENABLE_CRYPTODISK=y"
        regexp: "^#?GRUB_ENABLE_CRYPTODISK"

    - name: Set discard parameter
      ansible.builtin.set_fact:
        grub_discard_param: "{{ 'allow-discards' if bootloader_allow_discards else '' }}"

    - name: Kernel Params
      ansible.builtin.lineinfile:
        dest: /mnt/etc/default/grub
        regexp: "^#?GRUB_CMDLINE_LINUX="
        line: 'GRUB_CMDLINE_LINUX="cryptdevice={{ encryption_device }}:cryptroot:{{ grub_discard_param }} cryptkey=/crypto_keyfile.bin"'

- name: Install GRUB (UEFI)
  ansible.builtin.command: >
    arch-chroot /mnt grub-install --target=x86_64-efi --efi-directory={{ bootloader_esp_path }} --bootloader-id=GRUB-ARCH
  changed_when: true
  when: boot_mode == 'uefi'

- name: Install GRUB (BIOS)
  ansible.builtin.command: >
    arch-chroot /mnt grub-install --target=i386-pc {{ bootloader_device }}
  changed_when: true
  when: boot_mode == 'bios'

- name: Mkconfig
  ansible.builtin.command: arch-chroot /mnt grub-mkconfig -o /boot/grub/grub.cfg
  changed_when: true

- name: Verification
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]
  when: verify_enabled
