---
- name: Verify Antigravity binary exists
  ansible.builtin.stat:
    path: "{{ install_root if install_root | length > 0 else '' }}/usr/bin/antigravity"
  register: antigravity_stat

- name: Assert Antigravity binary exists
  ansible.builtin.assert:
    that:
      - antigravity_stat.stat.exists
    fail_msg: "Antigravity binary not found at {{ install_root if install_root | length > 0 else '' }}/usr/bin/antigravity"
