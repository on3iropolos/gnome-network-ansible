# Install systemd-boot
- name: install systemd-boot
  command: arch-chroot /mnt bootctl install

# Enable encryption in bootloader configuration
- name: configure systemd-boot
  lineinfile:
    dest: /mnt{{ boot_esp }}/loader/loader.conf
    regexp: "{{ item.regex }}"
    line: "{{ item.line }}"
  loop:
    - { regex: "^default", line: "default arch.conf" }
    - { regex: "^timeout", line: "timeout 4" }
    - { regex: "^console-mode", line: "console-mode max" }
    - { regex: "^editor", line: "editor no" }

# # Configure systemd-boot for encrypted system
# - name: Create systemd-boot entry for encrypted system
