#     mode: 0755

# # Generate systemd-boot configuration
# - name: Generate systemd-boot configuration
#   command: arch-chroot /mnt bootctl update

- name: Get UUID of root device
  command: blkid -s UUID -o value {{ root_part }}
  register: root_device_uuid
  ignore_errors: yes

- name: Configure systemd-boot entry for arch
  lineinfile:
    create: true
    dest: /mnt{{ boot_esp }}/loader/entries/arch.conf
    regexp: "{{ item.regex }}"
    line: "{{ item.line }}"
  loop:
    - { regex: "^title", line: "title   Arch Linux" }
    - { regex: "^linux", line: "linux   /vmlinuz-linux" }
    - { regex: "^initrd", line: "initrd  /initramfs-linux.img" }
    # - { regex: "^options", line: "options cryptdevice={{ root_part }}:cryptroot:allow-discards root=/dev/mapper/cryptroot rw" }
    - { regex: "^options", line: "options rd.luks.name={{ root_device_uuid.stdout }}=root root=/dev/mapper/cryptroot" }
