---
- name: Install Docker
  ansible.builtin.package:
    name:
      - docker
    state: present
  tags: [docker]

- name: Create Docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"
  tags: [docker]

- name: Configure Docker daemon address pool
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "default-address-pools": [
          { "base": "{{ docker_default_address_pools_base }}", "size": 24 }
        ],
        "live-restore": true,
        "userland-proxy": false
      }
    mode: "0644"
  notify: Restart Docker
  tags: [docker]

- name: Secure Docker socket
  ansible.builtin.file:
    path: /var/run/docker.sock
    mode: '0660'
    owner: root
    group: docker
  tags: [docker]

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  tags: [docker]

- name: Get user groups
  ansible.builtin.command: id -nG "{{ ansible_user }}"
  register: user_groups
  changed_when: false
  when: ansible_user is defined
  tags: [docker]

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: ansible_user is defined and "'docker' not in user_groups.stdout" | bool
  tags: [docker]

- name: Verification
  ansible.builtin.include_tasks: verify.yml
  tags: [verify, docker]
  when: verify_enabled
