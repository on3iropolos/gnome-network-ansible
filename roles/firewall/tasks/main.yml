---
- name: Install UFW
  ansible.builtin.package:
    name: ufw
    state: present

- name: Reset UFW to defaults
  community.general.ufw:
    state: reset

- name: Set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port }}"
    proto: tcp

- name: Allow defined services
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
  loop: "{{ firewall_allowed_services }}"
  when: firewall_allowed_services is defined

- name: Allow traffic on libvirt bridge (virbr0)
  community.general.ufw:
    rule: allow
    direction: in
    interface: virbr0
    comment: Allow libvirt guest traffic

- name: Allow routed traffic on libvirt bridge (virbr0)
  community.general.ufw:
    rule: allow
    route: true
    interface_in: virbr0
    comment: Allow libvirt routed traffic

- name: Enable UFW
  community.general.ufw:
    state: disabled

- name: Verification
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]
  when: verify_enabled
