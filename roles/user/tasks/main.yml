---
# NOTE: password_hash filter requires passlib Python package in Ansible controller's Python environment
# When using mise with pipx:ansible-core, passlib must be symlinked into the pipx venv:
# ln -s ~/.local/share/mise/installs/python/X.Y.Z/lib/pythonX.Y/site-packages/passlib \
#        ~/.local/share/mise/installs/pipx-ansible-core/VERSION/ansible-core/lib/pythonX.Y/site-packages/passlib
# Alternative: pre-compute hash and use vault to avoid runtime passlib dependency

- name: Create User
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups:
      - wheel
    shell: "{{ user_shell }}"
    append: true
    state: present

- name: Set Password
  ansible.builtin.user:
    name: "{{ user_name }}"
    password: "{{ user_password | password_hash('sha512') }}"
  when: user_password | length > 0
  no_log: true

- name: Sudoers
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/10-wheel"
    content: "%wheel ALL=(ALL) ALL"
    mode: '0440'
    owner: root
    group: root
    validate: 'visudo -cf %s'

- name: User NOPASSWD sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/12-{{ user_name }}-nopasswd"
    content: "{{ user_name }} ALL=(ALL) NOPASSWD: ALL"
    mode: '0440'
    owner: root
    group: root
    validate: 'visudo -cf %s'
  when: user_sudo_nopasswd | default(false) | bool

- name: SSH Directory
  ansible.builtin.file:
    path: "/home/{{ user_name }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ user_name }}"

- name: Authorized Keys
  ansible.builtin.copy:
    content: "{{ user_ssh_key }}"
    dest: "/home/{{ user_name }}/.ssh/authorized_keys"
    mode: '0600'
    owner: "{{ user_name }}"
  when: user_ssh_key | length > 0
  failed_when: false

- name: Verification
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]
  when: verify_enabled
