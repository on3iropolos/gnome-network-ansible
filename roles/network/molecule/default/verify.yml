---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Verify NetworkManager service is enabled
      ansible.builtin.systemd:
        name: NetworkManager
        enabled: true
      check_mode: true
      register: nm_check
      failed_when: nm_check is changed

    - name: Display verification results
      ansible.builtin.debug:
        msg: "All network role verifications passed successfully!"
