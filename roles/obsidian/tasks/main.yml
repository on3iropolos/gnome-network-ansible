---
- name: Install Obsidian
  ansible.builtin.package:
    name: obsidian
    state: present

- name: Ensure notes directory exists
  ansible.builtin.file:
    path: "/home/{{ user_name }}/{{ obsidian_notes_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  when: user_name != "root"

- name: Ensure Obsidian config directory exists
  ansible.builtin.file:
    path: "/home/{{ user_name }}/.config/obsidian"
    state: directory
    mode: '0755'
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  when: user_name != "root"

- name: Configure Obsidian to open vault on startup
  ansible.builtin.template:
    src: obsidian.json.j2
    dest: "/home/{{ user_name }}/.config/obsidian/obsidian.json"
    mode: '0644'
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  when: user_name != "root"

- name: Verification
  ansible.builtin.include_tasks: verify.yml
  tags: [verify, obsidian]
  when: verify_enabled
