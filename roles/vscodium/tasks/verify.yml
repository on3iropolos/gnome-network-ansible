---
- name: Verify VSCodium binary exists
  ansible.builtin.stat:
    path: /usr/bin/codium
  register: vscodium_stat

- name: Assert VSCodium binary exists
  ansible.builtin.assert:
    that:
      - vscodium_stat.stat.exists
    fail_msg: "VSCodium binary (codium) not found at /usr/bin/codium"

- name: Verify VSCodium extensions directory exists
  ansible.builtin.stat:
    path: "/home/{{ user_name }}/.config/VSCodium/User"
  register: vscodium_extensions_dir
  when: user_name != "root"

- name: Assert extensions directory exists
  ansible.builtin.assert:
    that:
      - vscodium_extensions_dir.stat.exists
    fail_msg: "VSCodium extensions directory not found"
  when: user_name != "root"
